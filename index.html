let dung=0,sai=0,done=new Set();
function getF(){return document.getElementById('f').value}
function render(){
let kw=document.getElementById('k').value.toLowerCase();
let f=getF();let list=document.getElementById('list');list.innerHTML='';
let c=0;
BANK.forEach((q,i)=>{
let n=i+1;if(f!=0 && q[0]!=f) return;
if(kw && !(q[1]+q[2]+q[3]+q[4]+q[5]).toLowerCase().includes(kw)) return;
c++;
let d=document.createElement('div');d.className='q';
d.innerHTML=`<div class="meta">Câu ${n} • P${q[0]}</div><b>${q[1]}</b><div class="opts"></div><div class="exp">Đáp án: <b>${['A','B','C','D'][q[6]]}. ${[q[2],q[3],q[4],q[5]][q[6]]}</b> — P${q[0]}</div>`;
let box=d.querySelector('.opts');
[q[2],q[3],q[4],q[5]].forEach((op,j)=>{
let b=document.createElement('button');b.className='opt';b.textContent=`${['A','B','C','D'][j]}. ${op}`;
b.onclick=()=>{
if(done.has(n)) return;
done.add(n);
let exp=d.querySelector('.exp');exp.style.display='block';
let btns=box.querySelectorAll('button');
btns[q[6]].classList.add('correct');
if(j===q[6]){dung++;b.classList.add('correct');}
else{b.classList.add('wrong');sai++;}
upd();document.getElementById('pfill').style.width=(done.size/400*100)+'%';
};
box.appendChild(b);
});
list.appendChild(d);
});
document.getElementById('p').textContent=`• Hiển thị ${c} câu`;
}
function upd(){document.getElementById('s').textContent=`Đúng:${dung} Sai:${sai} / 400 đã làm:${done.size}`}
function shuffle(){for(let i=BANK.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[BANK[i],BANK[j]]=[BANK[j],BANK[i]]}render()}
function reset(){dung=0;sai=0;done.clear();upd();render();document.getElementById('pfill').style.width='0'}
render();upd();
</script>
